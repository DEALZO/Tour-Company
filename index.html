<style>
   .trip-form { max-width: 600px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 12px; }
    
    /* STEP INDICATOR */
   .step-indicator { display: flex; justify-content: space-between; background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
   .step { width: 35px; height: 35px; border-radius: 50%; background: #e0e0e0; color: #666; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: all 0.3s; }
   .step.active { background: #c62828; color: white; }
   .step.completed { background: #c62828; color: white; }
   .step.completed::after { content: '✓'; }

   .form-group { margin-bottom: 20px; }
   .form-group label { display: block; font-weight: 600; margin-bottom: 8px; }
   .form-group label span { color: red; }
   .form-group select,.form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }

   .alert-box { background: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 8px; margin: 15px 0; display: flex; align-items: center; gap: 8px; }

    /* GUESTS + ROOMS COUNTER */
   .counter-box { border: 1px solid #ddd; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
   .counter-header { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 12px; }
   .counter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
   .counter-btns { display: flex; align-items: center; gap: 12px; }
   .counter-btn { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #ddd; background: #f5f5f5; font-size: 18px; cursor: pointer; }
   .counter-btn:disabled { opacity: 0.5; cursor: not-allowed; }
   .counter-value { font-size: 16px; font-weight: 600; min-width: 20px; text-align: center; }

   .btn-submit { width: 100%; padding: 15px; background: #c62828; color: white; border: none; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; }
</style>

<div class="trip-form">
    <!-- STEP INDICATOR -->
    <div class="step-indicator">
        <div class="step" id="step1">1</div>
        <div class="step" id="step2">2</div>
        <div class="step" id="step3">3</div>
        <div class="step" id="step4">4</div>
        <div class="step" id="step5">5</div>
        <div class="step" id="step6">6</div>
        <div class="step" id="step7">7</div>
    </div>

    <div class="form-group">
        <label>TRIP START DATE</label>
        <select id="tripDate">
            <option value="">Select Date</option>
            <option value="26/09/2026">26/09/2026</option>
        </select>
    </div>

    <div class="alert-box">🌟 Great, multiple trips are available!</div>

    <div class="form-group">
        <label>STARTING CITY <span>*</span></label>
        <select id="startCity">
            <option value="">Select City</option>
            <option value="Lahore">Lahore</option>
            <option value="Karachi">Karachi</option>
            <option value="Islamabad">Islamabad</option>
        </select>
    </div>

    <div class="form-group">
        <label>DESTINATION <span>*</span></label>
        <select id="destination">
            <option value="">Select destination</option>
            <option value="Skardu">Skardu</option>
            <option value="Naran">Naran</option>
        </select>
    </div>

    <div class="form-group">
        <label>NUMBER OF DAYS <span>*</span></label>
        <select id="numDays">
            <option value="">Select duration</option>
            <option value="3">3 Days</option>
            <option value="7">7 Days</option>
            <option value="14">14 Days</option>
        </select>
    </div>

    <div class="form-group">
        <label>HOTEL CATEGORY <span>*</span></label>
        <select id="hotelCat">
            <option value="">Select hotel category</option>
            <option value="3 Star">3 Star</option>
            <option value="4 Star">4 Star</option>
            <option value="5 Star">5 Star</option>
        </select>
    </div>

    <!-- GUESTS -->
    <div class="counter-box">
        <div class="counter-header">👥 GUESTS</div>
        <div class="counter-row">
            <label>Adults <span>*</span></label>
            <div class="counter-btns">
                <button type="button" class="counter-btn" onclick="updateCounter('adults', -1)">-</button>
                <span class="counter-value" id="adults">0</span>
                <button type="button" class="counter-btn" onclick="updateCounter('adults', 1)">+</button>
            </div>
        </div>
        <div class="counter-row">
            <label>Children</label>
            <div class="counter-btns">
                <button type="button" class="counter-btn" onclick="updateCounter('children', -1)">-</button>
                <span class="counter-value" id="children">0</span>
                <button type="button" class="counter-btn" onclick="updateCounter('children', 1)">+</button>
            </div>
        </div>
    </div>

    <!-- ROOMS -->
    <div class="counter-box">
        <div class="counter-header">🛏 ROOMS</div>
        <div class="counter-row">
            <label>Number of Rooms</label>
            <div class="counter-btns">
                <button type="button" class="counter-btn" onclick="updateCounter('rooms', -1)">-</button>
                <span class="counter-value" id="rooms">0</span>
                <button type="button" class="counter-btn" onclick="updateCounter('rooms', 1)">+</button>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>TRANSPORT TYPE <span>*</span></label>
        <select id="transport">
            <option value="">Select transport</option>
            <option value="Bus">Bus</option>
            <option value="Car">Car</option>
            <option value="Flight">Flight</option>
        </select>
    </div>

    <p style="font-size: 13px; color: #666; margin: 15px 0;">*If you don't find a suitable package that fits your number of days or destination, kindly contact us at <b><u>+92 336 3903371</u></b></p>

    <button class="btn-submit" onclick="submitForm()">Design My Trip →</button>
</div>

<script>
    let formData = {
        adults: 0,
        children: 0,
        rooms: 0
    };

    // COUNTER FUNCTION
    function updateCounter(type, change) {
        formData[type] += change;
        if(formData[type] < 0) formData[type] = 0;
        document.getElementById(type).textContent = formData[type];
        updateSteps();
    }

    // STEP PROGRESS FUNCTION
    function updateSteps() {
        // Step 1: Date
        if(document.getElementById('tripDate').value) markStep(1, true); else markStep(1, false);
        
        // Step 2: Start City
        if(document.getElementById('startCity').value) markStep(2, true); else markStep(2, false);
        
        // Step 3: Destination
        if(document.getElementById('destination').value) markStep(3, true); else markStep(3, false);
        
        // Step 4: Number of Days
        if(document.getElementById('numDays').value) markStep(4, true); else markStep(4, false);
        
        // Step 5: Hotel Category
        if(document.getElementById('hotelCat').value) markStep(5, true); else markStep(5, false);
        
        // Step 6: Guests
        if(formData.adults > 0) markStep(6, true); else markStep(6, false);
        
        // Step 7: Rooms + Transport
        if(formData.rooms > 0 && document.getElementById('transport').value) markStep(7, true); else markStep(7, false);
    }

    function markStep(stepNum, isCompleted) {
        const step = document.getElementById('step' + stepNum);
        if(isCompleted) {
            step.classList.add('completed');
            step.classList.remove('active');
        } else {
            step.classList.remove('completed');
            step.classList.add('active');
        }
    }

    // Add event listeners to all selects
    document.querySelectorAll('select').forEach(select => {
        select.addEventListener('change', updateSteps);
    });

    function submitForm() {
        alert('Form Submitted! Adults: ' + formData.adults + ', Children: ' + formData.children + ', Rooms: ' + formData.rooms);
    }

    // Initial call
    updateSteps();
</script>
